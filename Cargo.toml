[package]
name = "speakeasy"
version = "0.1.0"
edition = "2024"
description = "Record square interview answers and export 16:9 crops."

[profile.dev]
opt-level = 2

# No secrets here. The Gemini key lives only in
# ~/Library/Application Support/SpeakEasy/config.yaml at runtime.
[package.metadata.packager]
product-name = "SpeakEasy"
identifier = "com.neonink.speakeasy"
before-packaging-command = "cargo build --release"
out-dir = "dist"
formats = ["app"]
external-binaries = ["dist/vendor/ffmpeg", "dist/vendor/ffprobe"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
info-plist-path = "packaging/Info.plist"
entitlements = "packaging/entitlements.plist"
hardened-runtime = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
dirs = "6"
eframe = "0.36"
egui = "0.36"
hound = "3.5"
nokhwa = { version = "0.10.11", features = ["input-native", "output-threaded"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4"] }
